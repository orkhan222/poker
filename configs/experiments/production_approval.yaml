defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: hist_gradient_boosting
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: production_approval
description: Build the production approval contract for the deployed strategy stack.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_production_approval.py
  args:
    project_root: .
    out: ${logging.reports_dir}/production_approval.json
    markdown_out: ${logging.reports_dir}/production_approval.md
