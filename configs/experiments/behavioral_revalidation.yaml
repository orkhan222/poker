defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: behavioral_revalidation
description: Build the human-likeness and action-distribution revalidation boundary contract.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_behavioral_revalidation.py
  args:
    project_root: .
    out: ${logging.reports_dir}/behavioral_revalidation.json
    markdown_out: ${logging.reports_dir}/behavioral_revalidation.md
