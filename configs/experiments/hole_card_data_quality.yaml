defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: hole_card_data_quality
description: Build the hole-card data-quality limitation and routed-policy mitigation contract.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_hole_card_data_quality.py
  args:
    project_root: .
    out: ${logging.reports_dir}/hole_card_data_quality.json
    markdown_out: ${logging.reports_dir}/hole_card_data_quality.md
