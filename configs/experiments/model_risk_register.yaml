defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: hist_gradient_boosting
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: model_risk_register
description: Build the component-level model risk register.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_model_risk_register.py
  args:
    project_root: .
    out: ${logging.reports_dir}/model_risk_register.json
    markdown_out: ${logging.reports_dir}/model_risk_register.md
