defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: hist_gradient_boosting
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: challenger_strategy_quality
description: Enforce that final production-level strategy quality cannot be claimed before a stronger challenger passes the raw gate.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_challenger_strategy_quality.py
  args:
    project_root: .
    out: ${logging.reports_dir}/challenger_strategy_quality.json
    markdown_out: ${logging.reports_dir}/challenger_strategy_quality.md
