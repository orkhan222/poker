defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: bet_timing_calibration
description: Build the bet-sizing and timing implementation/measurement/calibration boundary.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_bet_timing_calibration.py
  args:
    project_root: .
    out: ${logging.reports_dir}/bet_timing_calibration.json
    markdown_out: ${logging.reports_dir}/bet_timing_calibration.md
