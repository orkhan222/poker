defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: actions_dataset_export_contract
description: Build the future actions.csv dataset export contract for explicit decision-time betting context.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_actions_dataset_export_contract.py
  args:
    project_root: .
    out: ${logging.reports_dir}/actions_dataset_export_contract.json
    markdown_out: ${logging.reports_dir}/actions_dataset_export_contract.md
