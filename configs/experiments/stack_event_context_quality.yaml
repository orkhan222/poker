defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: stack_event_context_quality
description: Build the stack_events.csv decision-context derivation contract.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_stack_event_context_quality.py
  args:
    project_root: .
    out: ${logging.reports_dir}/stack_event_context_quality.json
    markdown_out: ${logging.reports_dir}/stack_event_context_quality.md
    max_examples: 5000
