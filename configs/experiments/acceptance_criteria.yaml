defaults:
  - override /evaluation@_global_.evaluation: standard
  - override /logging@_global_.logging: local

name: acceptance_criteria
description: Numeric operational acceptance gates for latency, invalid actions, validation pass rate, and reproducibility.
task: command
allow_failure: false
command:
  entrypoint: scripts/check_acceptance_criteria.py
  args:
    metrics: ${logging.reports_dir}/acceptance_metrics.json
    out: ${logging.reports_dir}/acceptance_criteria.json
    latency_p95_ms_max: ${evaluation.acceptance.latency_p95_ms_max}
    latency_p99_ms_max: ${evaluation.acceptance.latency_p99_ms_max}
    invalid_action_rate_max: ${evaluation.acceptance.invalid_action_rate_max}
    validation_pass_rate_min: ${evaluation.acceptance.validation_pass_rate_min}
    reproducibility_pass_rate_min: ${evaluation.acceptance.reproducibility_pass_rate_min}
