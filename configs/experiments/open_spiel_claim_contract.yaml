defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: open_spiel_claim_contract
description: Build the OpenSpiel/RL self-play claim boundary from the Phase 3 arena report.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_open_spiel_claim_contract.py
  args:
    project_root: .
    out: ${logging.reports_dir}/open_spiel_claim_contract.json
    markdown_out: ${logging.reports_dir}/open_spiel_claim_contract.md
