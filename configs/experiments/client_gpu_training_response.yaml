defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: client_gpu_training_response
description: Build the client-facing A100/H100 training response and delivery boundary statement.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_client_gpu_training_response.py
  args:
    project_root: .
    out: ${logging.reports_dir}/client_gpu_training_response.json
    markdown_out: ${logging.reports_dir}/client_gpu_training_response.md