defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: strategy_stack_maturity
description: Build the deployment-with-monitoring boundary for the current strategy stack.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_strategy_stack_maturity.py
  args:
    project_root: .
    out: ${logging.reports_dir}/strategy_stack_maturity.json
    markdown_out: ${logging.reports_dir}/strategy_stack_maturity.md
