defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: text_event_smol
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: llm_architecture_comparison
description: Compare free generation and constrained candidate ranking using measured Qwen results.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_llm_architecture_comparison.py
  args:
    generation: ${logging.reports_dir}/llm_decision_context_qwen25.json
    candidate_ranker: ${logging.reports_dir}/llm_decision_candidate_ranker_qwen25.json
    generation_gate: ${logging.reports_dir}/llm_decision_gate.json
    candidate_gate: ${logging.reports_dir}/llm_decision_candidate_gate.json
    out: ${logging.reports_dir}/llm_architecture_comparison.json
    report_out: ${logging.reports_dir}/llm_architecture_comparison.md
