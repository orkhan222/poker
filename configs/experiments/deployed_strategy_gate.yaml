defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: hist_gradient_boosting
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: deployed_strategy_gate
description: Build the deployed strategy-stack approval gate report.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_deployed_strategy_gate.py
  args:
    project_root: .
    out: ${logging.reports_dir}/deployed_strategy_gate.json
    markdown_out: ${logging.reports_dir}/deployed_strategy_gate.md
