defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: production_runtime_monitoring
description: Build the production monitoring, rollback, and live drift tracking contract for real-traffic rollout.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_production_runtime_monitoring.py
  args:
    project_root: .
    out: ${logging.reports_dir}/production_runtime_monitoring.json
    markdown_out: ${logging.reports_dir}/production_runtime_monitoring.md
