defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: multi_agent_training_status
description: Build the formal boundary between delivery validation training and full production-scale multi-agent training.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_multi_agent_training_status.py
  args:
    project_root: .
    out: ${logging.reports_dir}/multi_agent_training_status.json
    markdown_out: ${logging.reports_dir}/multi_agent_training_status.md
