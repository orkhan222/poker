defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: scenario_sanity
description: Build targeted poker scenario sanity validation for critical strategy spots.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_scenario_sanity.py
  args:
    project_root: .
    out: ${logging.reports_dir}/scenario_sanity.json
    markdown_out: ${logging.reports_dir}/scenario_sanity.md
    fail_on_sanity_error: true
