defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: routed_bundle_smoke
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: llm_role_boundary
description: Build the LLM role boundary for controlled event-normalization and decision-context work.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_llm_role_boundary.py
  args:
    project_root: .
    out: ${logging.reports_dir}/llm_role_boundary.json
    markdown_out: ${logging.reports_dir}/llm_role_boundary.md
