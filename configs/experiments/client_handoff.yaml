defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: hist_gradient_boosting
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: client_handoff
description: Build the client-facing handoff contract with component-risk boundaries.
task: command
allow_failure: false
command:
  entrypoint: scripts/build_client_handoff.py
  args:
    project_root: .
    out: ${logging.reports_dir}/client_handoff.json
    markdown_out: ${logging.reports_dir}/client_handoff.md
